name: Lint (flutter analyze)

# Fast-feedback lint job. Catches Dart type errors and null-safety
# regressions in ~1-2 minutes vs the full build.yml's ~3 minutes.
# Runs independently of build.yml — both fire on push, lint usually
# finishes first.
#
# v0.1.29+11: added build_runner step. Without it Drift's `database.g.dart`
# isn't generated → 200+ `Undefined name 'trips'` / `Undefined class 'Trip'`
# errors because Drift symbols don't exist until codegen runs. The build.yml
# pipeline runs `dart run build_runner build --delete-conflicting-outputs`
# at the same point; lint.yml now matches.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        # `flutter create` needs Java for android/ scaffold. Pin to 17 to
        # match build.yml.
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Create Android project files
        # Same as build.yml — we commit lib/ + pubspec.yaml only, the
        # android/ folder is generated.
        run: |
          flutter create --platforms=android \
            --org com.bz5companion \
            --project-name bz5_companion .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        # Drift uses build_runner to generate `database.g.dart` from
        # `database.dart`. Without this, every Drift-using file fails
        # to analyze with hundreds of "undefined name" errors. Mirror
        # the build.yml step exactly.
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run analyzer
        # Default severity treats `error` as failure but lets `info` and
        # `warning` pass. Matches what `flutter build` itself enforces,
        # so the lint signal is identical to the build signal.
        run: flutter analyze
