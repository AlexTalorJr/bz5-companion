name: Lint (flutter analyze)

# Runs `flutter analyze` on every push and PR. This is the fast feedback
# loop that catches Dart type errors, null safety regressions, and unused
# imports before they reach the assembleRelease step in build.yml.
#
# History: v0.1.29+4 introduced a null-safety regression (changing
# `hasTemp` from `temp != null` to `tempForColor != null` lost type
# promotion on downstream `temp.toStringAsFixed(...)` calls). The full
# build.yml took ~3 minutes to install Android SDK before kernel snapshot
# revealed the error. This workflow catches the same class of errors in
# ~30 seconds because it skips the Android SDK install and Gradle build.
#
# Runs independently of build.yml — both fire on push, but lint usually
# finishes first. A red lint check means the build will fail too; fix
# lint first, then push again.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        # `flutter create` (next step) needs Java to scaffold the
        # android/ folder. Without this Flutter falls back to a JDK it
        # may not find on the runner image, slowing the step. Pin to 17
        # to match build.yml.
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Create Android project files (with valid name)
        # Required because we commit only lib/ and pubspec.yaml; the
        # android/ folder is generated. Without it `pub get` succeeds but
        # `analyze` can warn about missing platform dirs. Mirrors the
        # equivalent step in build.yml.
        run: |
          flutter create --platforms=android \
            --org com.bz5companion \
            --project-name bz5_companion .

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        # `--fatal-infos` and `--fatal-warnings` would make this stricter,
        # but for now we mirror what `flutter build` actually rejects so
        # the signal is the same. Adjust later if we want a separate
        # warning-clean target.
        run: flutter analyze
