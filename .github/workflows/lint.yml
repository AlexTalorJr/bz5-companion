# DISABLED v0.1.29+12.
#
# Reason: too much noise from pre-existing info/warning issues
# (deprecated_member_use, prefer_const_constructors, etc.) that lived
# in the repo before lint was added. Real type errors are already
# caught by build.yml at kernel snapshot — slower (~3 min vs ~30s)
# but signal-only, no noise.
#
# To re-enable: change `workflow_dispatch` block back to `push` /
# `pull_request` triggers (the analyze job below works correctly if
# triggered manually).

name: Lint (disabled)

on:
  workflow_dispatch:  # manual only — never fires automatically

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          # v0.1.29+28 follow-up: temurin instead of zulu (Azul CDN 520).
          # See build.yml for full rationale.
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true
      - name: Create Android project files
        run: |
          flutter create --platforms=android \
            --org com.bz5companion \
            --project-name bz5_companion .
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Run analyzer
        run: flutter analyze
